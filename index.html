<!DOCTYPE html>
<!-- Menentukan bahwa dokumen menggunakan HTML5 -->

<html>
<head>
    <!-- Bagian head berisi informasi tentang halaman web -->

    <meta charset="UTF-8">
    <!-- Mengatur karakter agar teks dan simbol dapat ditampilkan dengan benar -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mengatur tampilan agar menyesuaikan ukuran layar perangkat -->

    <title>Praktikum Algoritma Pemrograman</title>
    <!-- Menentukan judul halaman yang tampil pada tab browser -->

</head>

<body>
    <!-- Bagian body berisi seluruh konten yang ditampilkan di halaman web -->

    <!-- Membuat judul utama dan menempatkannya di tengah halaman -->
    <center>
        <h1>Praktikum Algoritma Pemrograman</h1>

        <!-- Menampilkan gambar logo dengan lebar 300 piksel -->
        <img src="Logo Lebak.png" width="300" height="auto">
    </center>

    <!-- Membuat judul tabel dan menempatkannya di tengah halaman -->
    <center>
        <b>
            Jumlah Sarana Perdagangan Menurut Jenisnya
            di Kabupaten Lebak
        </b>
    </center>

    <!-- Membuat tabel dengan garis tepi, lebar 500 piksel,
         dan jarak isi sel sebesar 10 piksel -->
    <center>
        <table border="1" width="500" cellpadding="10">

            <!-- Baris pertama berisi judul setiap kolom -->
            <tr>
                <td>Jenis Sarana Perdagangan</td>
                <td>2022</td>
                <td>2023</td>
                <td>2024</td>
                <td>2025</td>
            </tr>

            <!-- Baris kedua menunjukkan nomor urut kolom -->
            <tr>
                <td>( 1 )</td>
                <td>( 2 )</td>
                <td>( 3 )</td>
                <td>( 4 )</td>
                <td>( 5 )</td>
            </tr>

            <!-- Baris data jumlah pasar pada setiap tahun -->
            <tr>
                <td>Pasar</td>
                <td>13</td>
                <td>13</td>
                <td>13</td>
                <td>14</td>
            </tr>

            <!-- Baris data jumlah toko pada setiap tahun -->
            <tr>
                <td>Toko</td>
                <td>261</td>
                <td>225</td>
                <td>225</td>
                <td>191</td>
            </tr>

            <!-- Baris data jumlah kios pada setiap tahun -->
            <tr>
                <td>Kios</td>
                <td>883</td>
                <td>983</td>
                <td>903</td>
                <td>1.022</td>
            </tr>

            <!-- Baris terakhir berisi jumlah total sarana perdagangan -->
            <tr>
                <td>Jumlah/Total</td>
                <td>1.157</td>
                <td>1.251</td>
                <td>1.141</td>
                <td>1.227</td>
            </tr>

        </table>
    </center>

    <!-- Menampilkan gambar peta Kabupaten Lebak dengan lebar 300 piksel -->
    <center>
        <img src="Peta Lebak.png" width="300" height="auto">
    </center>

</body>
<!-- Tag penutup body menandai berakhirnya konten halaman -->

</html>
<!-- Tag penutup HTML menandai berakhirnya dokumen -->
